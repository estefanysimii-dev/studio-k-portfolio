name: Studio K CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:infinityfree
      - run: php -l infinityfree/index.php
      - run: npm test
      - name: Package InfinityFree website
        uses: actions/upload-artifact@v4
        with:
          name: studio-k-infinityfree-htdocs
          path: dist-infinityfree/
          include-hidden-files: true
          retention-days: 7
      - run: npm run build
        env:
          STUDIO_BACKEND_URL: https://studiokbot.up.railway.app
          STUDIO_PUBLIC_URL: https://studiokoficial.netlify.app

      - name: Package deploy source
        uses: actions/upload-artifact@v4
        with:
          name: studio-k-netlify-source
          path: |
            app
            components
            lib
            public
            types
            package.json
            package-lock.json
            tsconfig.json
            next-env.d.ts
            .gitignore
            README.md
          if-no-files-found: error
          retention-days: 1
