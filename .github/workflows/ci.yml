name: Studio K CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          STUDIO_BACKEND_URL: https://studiokbot.up.railway.app
          STUDIO_PUBLIC_URL: https://studiokoficial.netlify.app
